apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apex-redirect
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/permanent-redirect: "https://www.redfoxcohomes.com"
    nginx.ingress.kubernetes.io/permanent-redirect-code: "301"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - redfoxcohomes.com
    secretName: apex-tls-secret
  rules:
  - host: redfoxcohomes.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wordpress
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordpress-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # This next line allows you to upload large images to the WP Gallery
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - www.redfoxcohomes.com
    secretName: wordpress-tls-secret # Cert-Manager will safely store the cert here
  rules:
  - host: www.redfoxcohomes.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wordpress
            port:
              number: 80
