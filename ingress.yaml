apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordpress-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # This next line allows you to upload large images to the WP Gallery
    nginx.ingress.kubernetes.io/proxy-body-size: "50m" 
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - demo.redfoxcohomes.com
    secretName: wordpress-tls-secret # Cert-Manager will safely store the cert here
  rules:
  - host: demo.redfoxcohomes.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wordpress
            port:
              number: 80
