apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://raw.githubusercontent.com/kubernetes/website/main/content/en/examples/application/wordpress/mysql-deployment.yaml
  - https://raw.githubusercontent.com/kubernetes/website/main/content/en/examples/application/wordpress/wordpress-deployment.yaml
patches:
  - path: patch-wordpress-resources.yaml
  - path: patch-mysql-resources.yaml

images:
  - name: wordpress
    newName: wordpress
    newTag: php8.3-apache
